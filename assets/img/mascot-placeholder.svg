<!-- PLACEHOLDER MASCOT. A soap bubble with a face, drawn to be recognisable at
     32px. Replace this whole file with the real Soapz mascot artwork when it
     exists; keep the file name and the square viewBox and everything that
     references it keeps working. See README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Placeholder drawing of the Soapz mascot, a smiling soap bubble.">
  <defs>
    <radialGradient id="m-bubble" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bfe6fa"/>
      <stop offset="100%" stop-color="#56bcef"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="34" r="24" fill="url(#m-bubble)" stroke="#0a72a5" stroke-width="2.5"/>

  <!-- Highlight, so it reads as a bubble rather than a ball -->
  <ellipse cx="23" cy="23" rx="7" ry="5" fill="#ffffff" opacity=".85" transform="rotate(-25 23 23)"/>

  <!-- Face -->
  <circle cx="25" cy="33" r="2.6" fill="#0f2e42"/>
  <circle cx="39" cy="33" r="2.6" fill="#0f2e42"/>
  <path d="M24 41a9 9 0 0 0 16 0" fill="none" stroke="#0f2e42" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Two small bubbles drifting off, for a bit of movement -->
  <circle cx="52" cy="16" r="4.5" fill="#bfe6fa" stroke="#0a72a5" stroke-width="1.8"/>
  <circle cx="58" cy="27" r="2.5" fill="#eaf6fe" stroke="#0a72a5" stroke-width="1.4"/>
</svg>
